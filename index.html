<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whiteboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;
  --surface:#18181f;
  --surface2:#222230;
  --border:#2e2e3e;
  --accent:#6c63ff;
  --accent2:#ff6584;
  --text:#e8e8f0;
  --text2:#9090a8;
  --text3:#555568;
  --radius:12px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* ── Lobby ── */
#lobby{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:1000;
}
#lobby::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 600px 400px at 60% 40%,rgba(108,99,255,.08) 0%,transparent 70%),
             radial-gradient(ellipse 400px 300px at 20% 70%,rgba(255,101,132,.06) 0%,transparent 60%);
}
.lobby-card{
  position:relative;width:420px;background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:40px;box-shadow:var(--shadow);
}
.lobby-logo{
  font-size:28px;font-weight:600;letter-spacing:-.5px;margin-bottom:8px;
  background:linear-gradient(135deg,#6c63ff,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.lobby-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:24px}
.tab{
  flex:1;padding:9px;text-align:center;font-size:13px;font-weight:500;color:var(--text2);
  border-radius:7px;cursor:pointer;transition:.2s;border:none;background:transparent;
}
.tab.active{background:var(--surface2);color:var(--text)}
.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=password]{
  width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;transition:.2s;
}
input:focus{border-color:var(--accent)}
.btn{
  width:100%;padding:13px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5a52e0;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:var(--surface2);color:var(--text);margin-top:8px}
.btn-secondary:hover{background:var(--border)}
.error-msg{
  background:rgba(255,101,132,.1);border:1px solid rgba(255,101,132,.3);
  color:#ff8fa3;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;
}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── App Layout ── */
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}

/* ── Toolbar ── */
#toolbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-wrap:wrap;position:relative;z-index:100;
}
.tool-group{display:flex;align-items:center;gap:3px;padding:0 8px;border-right:1px solid var(--border)}
.tool-group:last-child{border-right:none}
.tool-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text2);border-radius:8px;
  cursor:pointer;transition:.15s;font-size:16px;position:relative;
}
.tool-btn:hover{background:var(--surface2);color:var(--text)}
.tool-btn.active{background:rgba(108,99,255,.2);color:var(--accent)}
.tool-btn[title]:hover::after{
  content:attr(title);position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);
  background:var(--surface2);color:var(--text);padding:4px 8px;border-radius:6px;
  font-size:11px;white-space:nowrap;pointer-events:none;z-index:999;border:1px solid var(--border);
}
.separator{width:1px;height:24px;background:var(--border);margin:0 4px}

/* Range input */
input[type=range]{
  -webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;
  outline:none;cursor:pointer;width:80px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;background:var(--accent);
  border-radius:50%;cursor:pointer;
}

/* Color palette */
.color-swatch{
  width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:.15s;flex-shrink:0;
}
.color-swatch.active,.color-swatch:hover{border-color:var(--text);transform:scale(1.15)}
.color-picker-wrap{position:relative}
#custom-color{
  width:22px;height:22px;padding:0;border:none;border-radius:50%;cursor:pointer;
  background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
  overflow:hidden;
}

/* Users panel */
#users-panel{
  display:flex;align-items:center;gap:6px;margin-left:auto;
}
.user-avatar{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#fff;border:2px solid var(--bg);margin-left:-6px;
  cursor:default;position:relative;
}
.user-avatar:first-child{margin-left:0}
#room-info{
  font-size:12px;color:var(--text2);background:var(--surface2);
  padding:5px 10px;border-radius:8px;cursor:pointer;
  font-family:'DM Mono',monospace;
}
#room-info:hover{color:var(--accent)}

/* ── Canvas area ── */
#canvas-wrap{
  flex:1;position:relative;overflow:hidden;background:#1a1a24;
  background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:24px 24px;
}
#main-canvas,#overlay-canvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
}
#overlay-canvas{pointer-events:none}

/* ── Cursors ── */
.remote-cursor{
  position:absolute;pointer-events:none;z-index:500;
  transform:translate(-2px,-2px);transition:top .05s,left .05s;
}
.remote-cursor svg{filter:drop-shadow(1px 2px 3px rgba(0,0,0,.4))}
.cursor-label{
  position:absolute;top:20px;left:8px;padding:2px 7px;border-radius:20px;
  font-size:11px;font-weight:600;color:#fff;white-space:nowrap;
}

/* ── Sticky notes ── */
.sticky-note{
  position:absolute;min-width:180px;min-height:120px;border-radius:12px;
  padding:10px;font-size:13px;line-height:1.5;cursor:move;user-select:none;
  box-shadow:0 4px 20px rgba(0,0,0,.3);resize:both;overflow:auto;z-index:200;
}
.sticky-note textarea{
  width:100%;height:calc(100% - 28px);background:transparent;border:none;
  outline:none;font-family:'DM Sans',sans-serif;font-size:13px;
  color:#1a1a1a;resize:none;cursor:text;
}
.note-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
}
.note-color-btns{display:flex;gap:4px}
.note-color-btn{width:14px;height:14px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.note-delete-btn{
  width:20px;height:20px;border:none;background:rgba(0,0,0,.15);
  border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;
  color:#333;opacity:0.6;
}
.note-delete-btn:hover{opacity:1;background:rgba(255,0,0,.2)}

/* ── Context menu ── */
#ctx-menu{
  position:fixed;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:6px;min-width:140px;box-shadow:var(--shadow);
  z-index:1000;display:none;
}
.ctx-item{
  padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px;
  display:flex;align-items:center;gap:8px;
}
.ctx-item:hover{background:var(--surface2)}
.ctx-item.danger{color:var(--accent2)}

/* ── Toast ── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:10px 20px;border-radius:10px;font-size:13px;z-index:9999;
  opacity:0;transition:.3s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- ════ LOBBY ════ -->
<div id="lobby">
  <div class="lobby-card">
    <div class="lobby-logo">✦ Whiteboard</div>
    <div class="lobby-sub">Real-time collaborative canvas</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('create')">Yangi xona</button>
      <button class="tab" onclick="switchTab('join')">Kirish</button>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <!-- Create tab -->
    <div id="tab-create" class="tab-panel active">
      <div class="form-group">
        <label>Xona nomi (ixtiyoriy)</label>
        <input type="text" id="room-name" placeholder="Masalan: Dizayn muhokamasi"/>
      </div>
      <div class="form-group">
        <label>Parol (ixtiyoriy)</label>
        <input type="password" id="create-password" placeholder="Xonani himoyalash uchun"/>
      </div>
      <button class="btn btn-primary" onclick="createRoom()">Xona yaratish →</button>
    </div>

    <!-- Join tab -->
    <div id="tab-join" class="tab-panel">
      <div class="form-group">
        <label>Xona ID</label>
        <input type="text" id="join-room-id" placeholder="8 belgili ID kiriting" maxlength="8" style="font-family:'DM Mono',monospace;letter-spacing:2px"/>
      </div>
      <div class="form-group" id="password-field" style="display:none">
        <label>Parol</label>
        <input type="password" id="join-password" placeholder="Xona paroli"/>
      </div>
      <button class="btn btn-primary" onclick="joinRoom()">Kirish →</button>
      <button class="btn btn-secondary" onclick="checkRoomPassword()">Tekshirish</button>
    </div>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="app">

  <!-- Toolbar -->
  <div id="toolbar">
    <!-- Drawing tools -->
    <div class="tool-group">
      <button class="tool-btn active" id="tool-pen" title="Qalam (P)" onclick="setTool('pen')">✏️</button>
      <button class="tool-btn" id="tool-eraser" title="O'chirg'ich (E)" onclick="setTool('eraser')">🧹</button>
      <button class="tool-btn" id="tool-line" title="Chiziq (L)" onclick="setTool('line')">╱</button>
      <button class="tool-btn" id="tool-rect" title="To'rtburchak (R)" onclick="setTool('rect')">▭</button>
      <button class="tool-btn" id="tool-circle" title="Doira (C)" onclick="setTool('circle')">◯</button>
      <button class="tool-btn" id="tool-triangle" title="Uchburchak" onclick="setTool('triangle')">△</button>
      <button class="tool-btn" id="tool-arrow" title="O'q" onclick="setTool('arrow')">→</button>
      <button class="tool-btn" id="tool-text" title="Matn (T)" onclick="setTool('text')">T</button>
      <button class="tool-btn" id="tool-select" title="Tanlash (S)" onclick="setTool('select')">↖</button>
    </div>

    <!-- Colors -->
    <div class="tool-group" style="gap:5px">
      <div class="color-swatch active" style="background:#e8e8f0" onclick="setColor('#e8e8f0')"></div>
      <div class="color-swatch" style="background:#6c63ff" onclick="setColor('#6c63ff')"></div>
      <div class="color-swatch" style="background:#ff6584" onclick="setColor('#ff6584')"></div>
      <div class="color-swatch" style="background:#43e97b" onclick="setColor('#43e97b')"></div>
      <div class="color-swatch" style="background:#f9c74f" onclick="setColor('#f9c74f')"></div>
      <div class="color-swatch" style="background:#48cae4" onclick="setColor('#48cae4')"></div>
      <div class="color-swatch" style="background:#ff9f1c" onclick="setColor('#ff9f1c')"></div>
      <div class="color-swatch" style="background:#ef233c" onclick="setColor('#ef233c')"></div>
      <div class="color-picker-wrap">
        <input type="color" id="custom-color" value="#ffffff" onchange="setColor(this.value)" title="Maxsus rang"/>
      </div>
    </div>

    <!-- Fill toggle & width -->
    <div class="tool-group" style="gap:8px">
      <button class="tool-btn" id="fill-toggle" title="To'ldirish" onclick="toggleFill()">◈</button>
      <input type="range" id="stroke-width" min="1" max="40" value="3" oninput="updateWidth(this.value)" title="Qalinlik"/>
      <span id="width-display" style="font-size:12px;color:var(--text2);min-width:20px;text-align:center">3</span>
      <input type="range" id="opacity-range" min="10" max="100" value="100" oninput="updateOpacity(this.value)" title="Shaffoflik"/>
      <span id="opacity-display" style="font-size:12px;color:var(--text2);min-width:30px">100%</span>
    </div>

    <!-- Actions -->
    <div class="tool-group">
      <button class="tool-btn" title="Orqaga (Ctrl+Z)" onclick="undo()">↩</button>
      <button class="tool-btn" title="Sticky note" onclick="addStickyNote()">📌</button>
      <button class="tool-btn" title="Rasm yuklash" onclick="document.getElementById('img-upload').click()">🖼</button>
      <input type="file" id="img-upload" accept="image/*" style="display:none" onchange="handleImageUpload(event)"/>
      <button class="tool-btn" title="Yuklab olish" onclick="downloadCanvas()">💾</button>
      <button class="tool-btn danger" title="Tozalash" onclick="clearBoard()" style="color:var(--accent2)">🗑</button>
    </div>

    <!-- Users -->
    <div id="users-panel">
      <div id="avatar-list" style="display:flex;align-items:center"></div>
      <div id="room-info" onclick="copyRoomLink()" title="Linkni nusxalash">📋 —</div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="cursors-layer"></div>
    <div id="notes-layer"></div>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="undo()">↩ Orqaga</div>
  <div class="ctx-item" onclick="addStickyNote()">📌 Sticky note</div>
  <div class="ctx-item" onclick="downloadCanvas()">💾 Yuklab olish</div>
  <div class="ctx-item danger" onclick="clearBoard()">🗑 Hammasini tozalash</div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════
// CONFIG — faqat bu qatorni o'zgartiring!
// ════════════════════════════════════════════════════════
const SERVER_URL = 'http://localhost:3001'; // → Render URL ga o'zgartiring

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let socket = null;
let currentRoomId = null;
let currentUser = null;
let currentTool = 'pen';
let currentColor = '#e8e8f0';
let currentWidth = 3;
let currentOpacity = 1;
let fillEnabled = false;
let isDrawing = false;
let currentStrokeId = null;
let currentPoints = [];
let startX = 0, startY = 0;
let strokes = []; // { id, tool, points, shapeData, color, width, opacity, fillColor, userId }
let stickyNotes = {}; // noteId -> el
let remoteStrokes = {}; // userId -> current drawing points
let onlineUsers = {};
let textInput = null;
const cursors = {};

// Canvas setup
const mainCanvas = document.getElementById('main-canvas');
const overlayCanvas = document.getElementById('overlay-canvas');
const ctx = mainCanvas.getContext('2d');
const octx = overlayCanvas.getContext('2d');

// ════════════════════════════════════════════════════════
// CANVAS RESIZE
// ════════════════════════════════════════════════════════
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  mainCanvas.width = w; mainCanvas.height = h;
  overlayCanvas.width = w; overlayCanvas.height = h;
  redrawAll();
}

window.addEventListener('resize', resizeCanvas);

// ════════════════════════════════════════════════════════
// LOBBY
// ════════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='create')||(i===1&&tab==='join')));
  document.getElementById('tab-create').classList.toggle('active', tab==='create');
  document.getElementById('tab-join').classList.toggle('active', tab==='join');
  hideError();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}

async function createRoom() {
  const name = document.getElementById('room-name').value;
  const password = document.getElementById('create-password').value;
  try {
    const res = await fetch(`${SERVER_URL}/api/rooms`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    enterRoom(data.roomId);
  } catch (e) {
    showError(e.message || 'Xona yaratib bo\'lmadi');
  }
}

async function checkRoomPassword() {
  const roomId = document.getElementById('join-room-id').value.trim().toLowerCase();
  if (!roomId) return showError('Xona ID kiriting');
  try {
    const res = await fetch(`${SERVER_URL}/api/rooms/${roomId}/join`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({}),
    });
    const data = await res.json();
    if (res.status === 404) return showError('Bunday xona mavjud emas');
    if (data.needsPassword) {
      document.getElementById('password-field').style.display = 'block';
      showError('Bu xona himoyalangan — parol kiriting');
      return;
    }
    if (res.ok) enterRoom(roomId);
  } catch(e) { showError('Server bilan aloqa yo\'q'); }
}

async function joinRoom() {
  const roomId = document.getElementById('join-room-id').value.trim().toLowerCase();
  const password = document.getElementById('join-password').value;
  if (!roomId) return showError('Xona ID kiriting');
  try {
    const res = await fetch(`${SERVER_URL}/api/rooms/${roomId}/join`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) return showError(data.error || 'Kira olmadingiz');
    enterRoom(roomId);
  } catch(e) { showError('Server bilan aloqa yo\'q'); }
}

function enterRoom(roomId) {
  currentRoomId = roomId;
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('room-info').textContent = `📋 ${roomId}`;
  resizeCanvas();
  connectSocket(roomId);
  loadRoomData(roomId);

  // URL ni yangilash
  const url = new URL(window.location.href);
  url.searchParams.set('room', roomId);
  window.history.pushState({}, '', url);
}

// Sahifa yuklanganda URL dan room id olish
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  const roomId = params.get('room');
  if (roomId) {
    document.getElementById('join-room-id').value = roomId;
    switchTab('join');
    checkRoomPassword();
  }
});

// ════════════════════════════════════════════════════════
// SOCKET
// ════════════════════════════════════════════════════════
function connectSocket(roomId) {
  socket = io(SERVER_URL);
  const userId = localStorage.getItem('wb-user-id') || crypto.randomUUID();
  localStorage.setItem('wb-user-id', userId);

  socket.on('connect', () => {
    socket.emit('join-room', { roomId, userId });
  });

  socket.on('joined', ({ user, onlineUsers: users }) => {
    currentUser = user;
    users.forEach(u => addUserAvatar(u));
  });

  socket.on('user-joined', (u) => {
    addUserAvatar(u);
    showToast(`${u.name} qo'shildi`);
  });

  socket.on('user-left', (u) => {
    removeUserAvatar(u.userId);
    removeCursor(u.userId);
    showToast(`${u.name} chiqdi`);
  });

  // Remote drawing
  socket.on('stroke-start', ({ userId, tool, color, width, opacity, fillColor }) => {
    remoteStrokes[userId] = { tool, color, width, opacity, fillColor, points: [] };
  });

  socket.on('stroke-point', ({ userId, x, y }) => {
    if (!remoteStrokes[userId]) return;
    remoteStrokes[userId].points.push({ x, y });
    redrawOverlay();
  });

  socket.on('stroke-end', (data) => {
    const { userId, strokeId, tool, points, shapeData, color, width, opacity, fillColor, fontSize, textContent } = data;
    delete remoteStrokes[userId];
    strokes.push({ id: strokeId, tool, points, shapeData, color, width, opacity, fillColor, fontSize, textContent, userId });
    redrawAll();
  });

  socket.on('stroke-removed', ({ strokeId }) => {
    strokes = strokes.filter(s => s.id !== strokeId);
    redrawAll();
  });

  socket.on('board-cleared', () => {
    strokes = [];
    redrawAll();
  });

  socket.on('image-add', (data) => {
    strokes.push({ id: data.strokeId, tool: 'image', shapeData: { x: data.x, y: data.y, width: data.width, height: data.height }, imageData: data.imageData });
    redrawAll();
  });

  socket.on('note-add', (data) => {
    createNoteEl(data.noteId, data.x, data.y, data.content, data.bgColor, false);
  });

  socket.on('note-update', (data) => {
    const el = document.querySelector(`[data-note-id="${data.noteId}"] textarea`);
    if (el) el.value = data.content;
  });

  socket.on('note-delete', ({ noteId }) => {
    const el = document.querySelector(`[data-note-id="${noteId}"]`);
    if (el) el.remove();
    delete stickyNotes[noteId];
  });

  socket.on('cursor-move', (data) => {
    updateRemoteCursor(data);
  });

  socket.on('error', ({ message }) => {
    showToast('⚠️ ' + message);
  });
}

async function loadRoomData(roomId) {
  try {
    const res = await fetch(`${SERVER_URL}/api/rooms/${roomId}/data`);
    const data = await res.json();

    strokes = data.strokes.map(s => ({
      id: s.id,
      tool: s.tool,
      points: s.points || [],
      shapeData: s.shape_data,
      color: s.color,
      width: s.width,
      opacity: s.opacity,
      fillColor: s.fill_color,
      fontSize: s.font_size,
      textContent: s.text_content,
      imageData: s.image_data,
      userId: s.user_id,
    }));

    data.notes.forEach(n => {
      createNoteEl(n.id, n.x, n.y, n.content, n.bg_color, false);
    });

    redrawAll();
  } catch(e) {
    console.error('Load data error:', e);
  }
}

// ════════════════════════════════════════════════════════
// TOOLS
// ════════════════════════════════════════════════════════
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`tool-${tool}`);
  if (btn) btn.classList.add('active');
  overlayCanvas.style.cursor = tool === 'eraser' ? 'cell' : tool === 'text' ? 'text' : 'crosshair';
  if (tool === 'select') overlayCanvas.style.cursor = 'default';
}

function setColor(c) {
  currentColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  const swatches = document.querySelectorAll('.color-swatch');
  swatches.forEach(s => { if (s.style.background === c) s.classList.add('active'); });
}

function updateWidth(v) {
  currentWidth = parseInt(v);
  document.getElementById('width-display').textContent = v;
}

function updateOpacity(v) {
  currentOpacity = parseInt(v) / 100;
  document.getElementById('opacity-display').textContent = v + '%';
}

function toggleFill() {
  fillEnabled = !fillEnabled;
  document.getElementById('fill-toggle').classList.toggle('active', fillEnabled);
}

// ════════════════════════════════════════════════════════
// DRAWING — CANVAS EVENTS
// ════════════════════════════════════════════════════════
overlayCanvas.addEventListener('mousedown', onPointerDown);
overlayCanvas.addEventListener('mousemove', onPointerMove);
overlayCanvas.addEventListener('mouseup', onPointerUp);
overlayCanvas.addEventListener('mouseleave', onPointerUp);
overlayCanvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e.touches[0]); }, {passive:false});
overlayCanvas.addEventListener('touchmove', e => { e.preventDefault(); onPointerMove(e.touches[0]); }, {passive:false});
overlayCanvas.addEventListener('touchend', e => { e.preventDefault(); onPointerUp(e.changedTouches[0]); }, {passive:false});
overlayCanvas.addEventListener('contextmenu', onContextMenu);

function getPos(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function onPointerDown(e) {
  if (currentTool === 'text') { placeTextInput(e); return; }
  hideContextMenu();

  const pos = getPos(e);
  isDrawing = true;
  startX = pos.x; startY = pos.y;
  currentPoints = [pos];
  currentStrokeId = crypto.randomUUID();

  socket?.emit('stroke-start', {
    tool: currentTool, color: currentColor, width: currentWidth,
    opacity: currentOpacity, fillColor: fillEnabled ? currentColor : null,
    strokeId: currentStrokeId,
  });
}

function onPointerMove(e) {
  const pos = getPos(e);

  // Cursor broadcast
  socket?.emit('cursor-move', { x: pos.x, y: pos.y });

  if (!isDrawing) return;

  if (currentTool === 'pen' || currentTool === 'eraser') {
    currentPoints.push(pos);
    socket?.emit('stroke-point', { x: pos.x, y: pos.y });
  }

  drawOverlay(pos);
}

function onPointerUp(e) {
  if (!isDrawing) return;
  isDrawing = false;

  const pos = getPos(e);
  const shapeData = getShapeData(pos);

  const strokeData = {
    strokeId: currentStrokeId,
    tool: currentTool,
    points: currentPoints,
    shapeData,
    color: currentColor,
    width: currentWidth,
    opacity: currentOpacity,
    fillColor: fillEnabled ? currentColor : null,
  };

  // Locally add
  strokes.push({ ...strokeData, id: currentStrokeId, userId: currentUser?.userId });
  socket?.emit('stroke-end', strokeData);

  currentPoints = [];
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  redrawAll();
}

function getShapeData(pos) {
  const tools = ['line','rect','circle','triangle','arrow'];
  if (!tools.includes(currentTool)) return null;
  return { x1: startX, y1: startY, x2: pos.x, y2: pos.y };
}

// ════════════════════════════════════════════════════════
// DRAWING FUNCTIONS
// ════════════════════════════════════════════════════════
function applyStyle(context, stroke) {
  context.globalAlpha = stroke.opacity || 1;
  context.strokeStyle = stroke.color || '#fff';
  context.fillStyle = stroke.fillColor || stroke.color || '#fff';
  context.lineWidth = stroke.width || 3;
  context.lineCap = 'round';
  context.lineJoin = 'round';
}

function drawStroke(context, stroke) {
  if (!stroke) return;
  context.save();
  applyStyle(context, stroke);

  switch(stroke.tool) {
    case 'pen':
      drawFreePen(context, stroke.points);
      break;
    case 'eraser':
      context.globalCompositeOperation = 'destination-out';
      context.globalAlpha = 1;
      context.lineWidth = stroke.width * 3;
      drawFreePen(context, stroke.points);
      context.globalCompositeOperation = 'source-over';
      break;
    case 'line':
      if (stroke.shapeData) drawLine(context, stroke.shapeData, stroke.fillColor);
      break;
    case 'rect':
      if (stroke.shapeData) drawRect(context, stroke.shapeData, stroke.fillColor);
      break;
    case 'circle':
      if (stroke.shapeData) drawCircle(context, stroke.shapeData, stroke.fillColor);
      break;
    case 'triangle':
      if (stroke.shapeData) drawTriangle(context, stroke.shapeData, stroke.fillColor);
      break;
    case 'arrow':
      if (stroke.shapeData) drawArrow(context, stroke.shapeData);
      break;
    case 'text':
      if (stroke.shapeData && stroke.textContent) {
        context.font = `${stroke.fontSize || 18}px 'DM Sans', sans-serif`;
        context.fillStyle = stroke.color;
        context.globalAlpha = stroke.opacity || 1;
        context.fillText(stroke.textContent, stroke.shapeData.x, stroke.shapeData.y);
      }
      break;
    case 'image':
      if (stroke.imageData && stroke.shapeData) {
        const img = new Image();
        img.src = stroke.imageData;
        img.onload = () => {
          context.drawImage(img, stroke.shapeData.x, stroke.shapeData.y, stroke.shapeData.width, stroke.shapeData.height);
        };
        if (img.complete) {
          context.drawImage(img, stroke.shapeData.x, stroke.shapeData.y, stroke.shapeData.width, stroke.shapeData.height);
        }
      }
      break;
  }
  context.restore();
}

function drawFreePen(context, points) {
  if (!points || points.length < 2) return;
  context.beginPath();
  context.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i+1].x) / 2;
    const my = (points[i].y + points[i+1].y) / 2;
    context.quadraticCurveTo(points[i].x, points[i].y, mx, my);
  }
  context.lineTo(points[points.length-1].x, points[points.length-1].y);
  context.stroke();
}

function drawLine(context, d, fill) {
  context.beginPath();
  context.moveTo(d.x1, d.y1);
  context.lineTo(d.x2, d.y2);
  context.stroke();
}

function drawRect(context, d, fill) {
  const x = Math.min(d.x1,d.x2), y = Math.min(d.y1,d.y2);
  const w = Math.abs(d.x2-d.x1), h = Math.abs(d.y2-d.y1);
  context.beginPath();
  context.rect(x, y, w, h);
  if (fill) context.fill();
  context.stroke();
}

function drawCircle(context, d, fill) {
  const cx = (d.x1+d.x2)/2, cy = (d.y1+d.y2)/2;
  const rx = Math.abs(d.x2-d.x1)/2, ry = Math.abs(d.y2-d.y1)/2;
  context.beginPath();
  context.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  if (fill) context.fill();
  context.stroke();
}

function drawTriangle(context, d, fill) {
  context.beginPath();
  context.moveTo((d.x1+d.x2)/2, d.y1);
  context.lineTo(d.x2, d.y2);
  context.lineTo(d.x1, d.y2);
  context.closePath();
  if (fill) context.fill();
  context.stroke();
}

function drawArrow(context, d) {
  const dx = d.x2-d.x1, dy = d.y2-d.y1;
  const angle = Math.atan2(dy, dx);
  const len = Math.sqrt(dx*dx+dy*dy);
  const headLen = Math.min(20, len*0.3);
  context.beginPath();
  context.moveTo(d.x1, d.y1);
  context.lineTo(d.x2, d.y2);
  context.stroke();
  context.beginPath();
  context.moveTo(d.x2, d.y2);
  context.lineTo(d.x2 - headLen*Math.cos(angle-Math.PI/6), d.y2 - headLen*Math.sin(angle-Math.PI/6));
  context.moveTo(d.x2, d.y2);
  context.lineTo(d.x2 - headLen*Math.cos(angle+Math.PI/6), d.y2 - headLen*Math.sin(angle+Math.PI/6));
  context.stroke();
}

function drawOverlay(pos) {
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  octx.save();
  octx.globalAlpha = currentOpacity;
  octx.strokeStyle = currentColor;
  octx.fillStyle = currentColor;
  octx.lineWidth = currentWidth;
  octx.lineCap = 'round';
  octx.lineJoin = 'round';

  const d = { x1: startX, y1: startY, x2: pos.x, y2: pos.y };

  switch(currentTool) {
    case 'pen': drawFreePen(octx, currentPoints); break;
    case 'eraser':
      octx.globalCompositeOperation = 'destination-out';
      octx.lineWidth = currentWidth * 3;
      drawFreePen(octx, currentPoints);
      octx.globalCompositeOperation = 'source-over';
      break;
    case 'line': drawLine(octx, d); break;
    case 'rect': drawRect(octx, d, fillEnabled ? currentColor : null); break;
    case 'circle': drawCircle(octx, d, fillEnabled ? currentColor : null); break;
    case 'triangle': drawTriangle(octx, d, fillEnabled ? currentColor : null); break;
    case 'arrow': drawArrow(octx, d); break;
  }

  // Remote strokes on overlay
  Object.values(remoteStrokes).forEach(rs => {
    octx.save();
    octx.globalAlpha = rs.opacity || 1;
    octx.strokeStyle = rs.color;
    octx.lineWidth = rs.width;
    octx.lineCap = 'round';
    octx.lineJoin = 'round';
    drawFreePen(octx, rs.points);
    octx.restore();
  });

  octx.restore();
}

function redrawAll() {
  ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
  strokes.forEach(s => drawStroke(ctx, s));
}

function redrawOverlay() {
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  Object.values(remoteStrokes).forEach(rs => {
    octx.save();
    octx.globalAlpha = rs.opacity || 1;
    octx.strokeStyle = rs.color;
    octx.lineWidth = rs.width;
    octx.lineCap = 'round';
    octx.lineJoin = 'round';
    drawFreePen(octx, rs.points);
    octx.restore();
  });
}

// ════════════════════════════════════════════════════════
// TEXT TOOL
// ════════════════════════════════════════════════════════
function placeTextInput(e) {
  if (textInput) textInput.remove();
  const pos = getPos(e);
  textInput = document.createElement('textarea');
  textInput.style.cssText = `
    position:absolute;left:${pos.x}px;top:${pos.y}px;
    background:rgba(108,99,255,.15);border:1px dashed var(--accent);
    color:${currentColor};font-size:${Math.max(currentWidth * 4, 16)}px;
    font-family:'DM Sans',sans-serif;outline:none;resize:both;
    min-width:120px;min-height:40px;padding:4px 8px;border-radius:6px;z-index:300;
  `;
  document.getElementById('canvas-wrap').appendChild(textInput);
  textInput.focus();

  textInput.addEventListener('blur', () => {
    const text = textInput.value.trim();
    if (text) {
      const strokeId = crypto.randomUUID();
      const shapeData = { x: pos.x, y: pos.y + Math.max(currentWidth * 4, 16) };
      const strokeData = {
        strokeId, tool: 'text', points: [],
        shapeData, color: currentColor, width: currentWidth,
        opacity: currentOpacity, fillColor: null,
        fontSize: Math.max(currentWidth * 4, 16), textContent: text,
      };
      strokes.push({ ...strokeData, id: strokeId, userId: currentUser?.userId });
      socket?.emit('stroke-end', strokeData);
      redrawAll();
    }
    textInput.remove();
    textInput = null;
  });

  textInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { textInput.remove(); textInput = null; }
  });
}

// ════════════════════════════════════════════════════════
// STICKY NOTES
// ════════════════════════════════════════════════════════
const NOTE_COLORS = ['#fef08a','#bbf7d0','#bfdbfe','#fecaca','#e9d5ff','#fed7aa'];

function addStickyNote() {
  const noteId = crypto.randomUUID();
  const x = 100 + Math.random() * 200;
  const y = 100 + Math.random() * 200;
  const bgColor = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)];
  createNoteEl(noteId, x, y, '', bgColor, true);
  socket?.emit('note-add', { noteId, x, y, content: '', bgColor, width: 200, height: 150 });
}

function createNoteEl(noteId, x, y, content, bgColor, editable) {
  const el = document.createElement('div');
  el.className = 'sticky-note';
  el.dataset.noteId = noteId;
  el.style.cssText = `left:${x}px;top:${y}px;background:${bgColor || '#fef08a'};width:200px;height:150px;`;

  const header = document.createElement('div');
  header.className = 'note-header';

  const colorBtns = document.createElement('div');
  colorBtns.className = 'note-color-btns';
  NOTE_COLORS.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'note-color-btn';
    btn.style.background = c;
    btn.onclick = () => { el.style.background = c; };
    colorBtns.appendChild(btn);
  });

  const delBtn = document.createElement('button');
  delBtn.className = 'note-delete-btn';
  delBtn.textContent = '×';
  delBtn.onclick = () => {
    el.remove();
    delete stickyNotes[noteId];
    socket?.emit('note-delete', { noteId });
  };

  header.appendChild(colorBtns);
  header.appendChild(delBtn);

  const ta = document.createElement('textarea');
  ta.value = content || '';
  ta.placeholder = 'Yozing...';

  let saveTimeout;
  ta.addEventListener('input', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      const rect = el.getBoundingClientRect();
      const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
      socket?.emit('note-update', {
        noteId, content: ta.value,
        x: rect.left - wrap.left, y: rect.top - wrap.top,
      });
    }, 500);
  });

  el.appendChild(header);
  el.appendChild(ta);
  document.getElementById('notes-layer').appendChild(el);

  makeDraggable(el, noteId);
  stickyNotes[noteId] = el;
}

function makeDraggable(el, noteId) {
  let ox, oy, dragging = false;
  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || e.target.className === 'note-color-btn') return;
    dragging = true;
    ox = e.clientX - el.offsetLeft;
    oy = e.clientY - el.offsetTop;
    el.style.zIndex = 300;
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    el.style.left = (e.clientX - ox) + 'px';
    el.style.top = (e.clientY - oy) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      const ta = el.querySelector('textarea');
      socket?.emit('note-update', { noteId, content: ta?.value || '', x: el.offsetLeft, y: el.offsetTop });
    }
  });
}

// ════════════════════════════════════════════════════════
// UNDO, CLEAR, DOWNLOAD
// ════════════════════════════════════════════════════════
function undo() {
  if (!currentUser) return;
  const myStrokes = strokes.filter(s => s.userId === currentUser.userId);
  if (myStrokes.length === 0) return;
  const last = myStrokes[myStrokes.length - 1];
  strokes = strokes.filter(s => s.id !== last.id);
  redrawAll();
  socket?.emit('undo');
}

function clearBoard() {
  if (!confirm('Barcha chizmalar o\'chiriladi. Davom etasizmi?')) return;
  strokes = [];
  redrawAll();
  socket?.emit('clear-board');
}

function downloadCanvas() {
  // Asosiy canvas + notes ni birlashtirish
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = mainCanvas.width;
  tempCanvas.height = mainCanvas.height;
  const tCtx = tempCanvas.getContext('2d');
  tCtx.fillStyle = '#1a1a24';
  tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
  tCtx.drawImage(mainCanvas, 0, 0);

  const link = document.createElement('a');
  link.download = `whiteboard-${currentRoomId}-${Date.now()}.png`;
  link.href = tempCanvas.toDataURL('image/png');
  link.click();
}

// ════════════════════════════════════════════════════════
// IMAGE UPLOAD
// ════════════════════════════════════════════════════════
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 400, maxH = 300;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      if (h > maxH) { w = w * maxH / h; h = maxH; }
      const x = (mainCanvas.width - w) / 2;
      const y = (mainCanvas.height - h) / 2;

      const strokeId = crypto.randomUUID();
      const data = { strokeId, x, y, width: w, height: h, imageData: ev.target.result };
      strokes.push({ id: strokeId, tool: 'image', shapeData: { x, y, width: w, height: h }, imageData: ev.target.result });
      socket?.emit('image-add', data);
      redrawAll();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

// ════════════════════════════════════════════════════════
// CURSORS
// ════════════════════════════════════════════════════════
function updateRemoteCursor({ userId, name, color, x, y }) {
  let el = cursors[userId];
  if (!el) {
    el = document.createElement('div');
    el.className = 'remote-cursor';
    el.innerHTML = `
      <svg width="20" height="24" viewBox="0 0 20 24">
        <path d="M0 0L0 18L5 13L8 20L11 19L8 12L14 12Z" fill="${color}" stroke="rgba(0,0,0,.4)" stroke-width="1"/>
      </svg>
      <div class="cursor-label" style="background:${color}">${name}</div>
    `;
    document.getElementById('cursors-layer').appendChild(el);
    cursors[userId] = el;
  }
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function removeCursor(userId) {
  if (cursors[userId]) { cursors[userId].remove(); delete cursors[userId]; }
}

// ════════════════════════════════════════════════════════
// USERS
// ════════════════════════════════════════════════════════
function addUserAvatar({ userId, name, color }) {
  onlineUsers[userId] = { name, color };
  const list = document.getElementById('avatar-list');
  if (document.querySelector(`[data-uid="${userId}"]`)) return;
  const el = document.createElement('div');
  el.className = 'user-avatar';
  el.dataset.uid = userId;
  el.style.background = color;
  el.textContent = name[0].toUpperCase();
  el.title = name;
  list.appendChild(el);
}

function removeUserAvatar(userId) {
  const el = document.querySelector(`[data-uid="${userId}"]`);
  if (el) el.remove();
  delete onlineUsers[userId];
}

// ════════════════════════════════════════════════════════
// CONTEXT MENU
// ════════════════════════════════════════════════════════
function onContextMenu(e) {
  e.preventDefault();
  const menu = document.getElementById('ctx-menu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
}

function hideContextMenu() {
  document.getElementById('ctx-menu').style.display = 'none';
}

document.addEventListener('click', hideContextMenu);

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function copyRoomLink() {
  const url = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
  navigator.clipboard.writeText(url).then(() => showToast('🔗 Link nusxalandi!'));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (!currentRoomId) return;
  if (e.ctrlKey && e.key === 'z') { undo(); return; }
  if (e.key === 'Escape') { if (textInput) { textInput.remove(); textInput = null; } }
  const tools = { p:'pen', e:'eraser', l:'line', r:'rect', c:'circle', t:'text', s:'select' };
  if (!e.ctrlKey && !e.altKey && tools[e.key]) setTool(tools[e.key]);
});
